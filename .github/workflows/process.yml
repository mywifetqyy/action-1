      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y webp 7zip unrar
          cwebp -version
          unrar | head -n 2 || true
          7z | head -n 2 || true
          python -m gallery_dl --version

      - name: Preflight check
        run: |
          set -e
          command -v cwebp >/dev/null || { echo "::error::缺少 cwebp"; exit 1; }
          command -v unrar >/dev/null || { echo "::error::缺少 unrar"; exit 1; }
          command -v 7z    >/dev/null || { echo "::error::缺少 7z"; exit 1; }
          python -c "import requests, PIL, pyzipper; print('python deps ok')"
          echo "preflight ok"

      - name: Run process
        env:
          QUALITY: ${{ inputs.quality || '90' }}
          MAX_SIZE: ${{ inputs.max_size || '' }}
          COMPRESS_LEVEL: ${{ inputs.compress_level || '1' }}
          DOWNLOADER: ${{ inputs.downloader || 'auto' }}
          BUNDLE_SIZE_MB: ${{ inputs.bundle_size_mb || '1024' }}
          DOWNLOAD_HEADERS: ${{ secrets.DOWNLOAD_HEADERS }}
          DOWNLOAD_COOKIE: ${{ secrets.DOWNLOAD_COOKIE }}
          DOWNLOAD_USER_AGENT: ${{ secrets.DOWNLOAD_USER_AGENT }}
          SEVEN_ZIP_PATH: /usr/bin/7z
          RAR_PASSWORD: ${{ secrets.RAR_PASSWORD }}
        run: |
          ARGS=(--urls urls.txt --output output
                --quality "$QUALITY"
                --compress-level "$COMPRESS_LEVEL"
                --downloader "$DOWNLOADER"
                --download-workers 5
                --convert-workers 2
                --min-request-interval 1.0
                --bundle-size-mb "$BUNDLE_SIZE_MB")
          if [ -n "$MAX_SIZE" ]; then ARGS+=(--max-size "$MAX_SIZE"); fi
          python scripts/process.py "${ARGS[@]}"