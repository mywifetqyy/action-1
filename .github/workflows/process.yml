name: Batch Zip -> WebP

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "下载链接(每行一个,支持多个)"
        required: true
        type: string
      quality:
        description: "WebP 质量 (1-100)"
        required: false
        default: "90"
      max_size:
        description: "最大边长(像素,留空表示不缩放)"
        required: false
        default: ""
      compress_level:
        description: "zip 压缩级别 1-9(越大越慢)"
        required: false
        default: "1"
      downloader:
        description: "下载器 auto / gallery-dl / requests"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: batch-zip-webp
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install gallery-dl
        run: |
          pip install gallery-dl
          python -m gallery_dl --version

      # 把手动输入的链接写到临时 urls.txt,供脚本读取。
      - name: Write urls.txt
        env:
          INPUT_URLS: ${{ inputs.urls }}
        run: |
          printf '%s\n' "$INPUT_URLS" > urls.txt
          echo "=== urls.txt ==="
          cat urls.txt

      - name: Run process
        env:
          QUALITY: ${{ inputs.quality || '90' }}
          MAX_SIZE: ${{ inputs.max_size || '' }}
          COMPRESS_LEVEL: ${{ inputs.compress_level || '1' }}
          DOWNLOADER: ${{ inputs.downloader || 'auto' }}
          DOWNLOAD_HEADERS: ${{ secrets.DOWNLOAD_HEADERS }}
          DOWNLOAD_COOKIE: ${{ secrets.DOWNLOAD_COOKIE }}
          DOWNLOAD_USER_AGENT: ${{ secrets.DOWNLOAD_USER_AGENT }}
        run: |
          ARGS=(--urls urls.txt --output output
                --quality "$QUALITY"
                --compress-level "$COMPRESS_LEVEL"
                --downloader "$DOWNLOADER")
          if [ -n "$MAX_SIZE" ]; then ARGS+=(--max-size "$MAX_SIZE"); fi
          python scripts/process.py "${ARGS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webp-zips
          path: output/*.zip
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: output/*.zip
          generate_release_notes: true